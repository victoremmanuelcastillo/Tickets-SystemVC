version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: tickets_db
    environment:
      POSTGRES_DB: tickets_db
      POSTGRES_USER: tickets_user
      POSTGRES_PASSWORD: tickets_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tickets_user -d tickets_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    container_name: tickets_api
    environment:
      DATABASE_URL: postgresql://tickets_user:tickets_pass@db:5432/tickets_db
      JWT_SECRET: cambia_esto_en_produccion_xK9#mP2
      PORT: 3000
      NODE_ENV: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FRONTEND_URL: http://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: npm run dev

volumes:
  postgres_data:
